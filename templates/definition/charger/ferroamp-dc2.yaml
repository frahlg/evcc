template: ferroamp-dc2
covers: ["ferroamp-dc2"]
products:
  - brand: Ferroamp
    description:
      generic: DC2 V2X 20kW Bidirectional Charger
requirements:
  description:
    de: Der DC2 V2X muss im Manuellen Modus sein, damit die MQTT-Steuerung funktioniert. Der MQTT-Broker läuft auf dem DC2 selbst.
    en: The DC2 V2X must be in Manual mode for external MQTT control. The MQTT broker runs on the DC2 charger itself.
params:
  - name: host
    help:
      de: IP-Adresse oder Hostname des DC2 V2X Chargers
      en: IP address or hostname of the DC2 V2X charger
  - name: port
    default: 1883
    advanced: true
  - name: user
    default: dc2
    advanced: true
  - name: password
    default: dc2mqtt
    advanced: true
  - name: connector
    default: 1
    advanced: true
    description:
      de: Connector-Nummer
      en: Connector number
render: |
  type: ferroamp-dc2
  broker: {{ .host }}:{{ .port }}
  user: {{ .user }}
  password: {{ .password }}
  connector: {{ .connector }}
